
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Camera XYZ Tracker</title>

  <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>

  <style>
    body {
      background: #10151f;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
    }

    h1 { color: #62e6a7; }

    #camera {
      position: relative;
      width: 100%;
      max-width: 800px;
      margin: 20px auto;
      line-height: 0;
    }

    video {
      width: 100%;
      transform: scaleX(-1);
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      transform: scaleX(-1);
    }

    #info {
      background: #202b3b;
      max-width: 760px;
      margin: auto;
      padding: 15px;
      border-radius: 12px;
      text-align: left;
      font-size: 20px;
      line-height: 1.8;
    }

    button {
      padding: 12px 24px;
      border: 0;
      border-radius: 8px;
      background: #62e6a7;
      font-size: 17px;
      cursor: pointer;
    }

    #status { color: #ffd166; }
  </style>
</head>

<body>
  <h1>Camera XYZ Tracker</h1>
  <p>실시간 얼굴 인식 및 좌표</p>

  <button id="start">카메라 시작</button>
  <p id="status">시작 버튼을 눌러 주세요.</p>

  <div id="camera">
    <video id="video" autoplay muted playsinline></video>
    <canvas id="canvas"></canvas>
  </div>

  <div id="info">
    <div style="color:#ff7272">X: <span id="x">--</span> px</div>
    <div style="color:#62e6a7">Y: <span id="y">--</span> px</div>
    <div style="color:#65baff">Z: <span id="z">--</span> (상대값)</div>
  </div>

  <p>X = 좌우 | Y = 상하 | Z = 상대 거리 지표</p>

  <script>
    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const status = document.getElementById("status");

    let busy = false;
    let modelLoaded = false;

    document.getElementById("start").onclick = async function () {
      this.disabled = true;

      try {
        status.textContent = "얼굴 인식 모델을 불러오는 중...";

        const MODEL =
          "https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/";

        await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL);
        modelLoaded = true;

        status.textContent = "카메라 권한을 요청하는 중...";

        const stream = await navigator.mediaDevices.getUserMedia({
          video: true,
          audio: false
        });

        video.srcObject = stream;

        await new Promise(resolve => {
          video.onloadedmetadata = resolve;
        });

        await video.play();

        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;

        status.textContent = "카메라 실행 중";
        detect();
      } catch (error) {
        console.error(error);
        status.textContent =
          "실행 실패: 인터넷, HTTPS 또는 카메라 권한을 확인하세요.";
        this.disabled = false;
      }
    };

    async function detect() {
      if (!modelLoaded || busy) {
        requestAnimationFrame(detect);
        return;
      }

      busy = true;

      try {
        const W = video.videoWidth;
        const H = video.videoHeight;

        ctx.clearRect(0, 0, W, H);

        // 화면 중앙 십자선
        ctx.strokeStyle = "white";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(W / 2 - 15, H / 2);
        ctx.lineTo(W / 2 + 15, H / 2);
        ctx.moveTo(W / 2, H / 2 - 15);
        ctx.lineTo(W / 2, H / 2 + 15);
        ctx.stroke();

        const faces = await faceapi.detectAllFaces(
          video,
          new faceapi.TinyFaceDetectorOptions({
            inputSize: 320,
            scoreThreshold: 0.5
          })
        );

        if (faces.length > 0) {
          const face = faces.reduce((a, b) =>
            a.box.width * a.box.height >
            b.box.width * b.box.height ? a : b
          );

          const box = face.box;
          const cx = box.x + box.width / 2;
          const cy = box.y + box.height / 2;

          const X = Math.round(cx - W / 2);
          const Y = Math.round(H / 2 - cy);
          const Z = (1000 / Math.max(box.width, 1)).toFixed(2);

          document.getElementById("x").textContent = X;
          document.getElementById("y").textContent = Y;
          document.getElementById("z").textContent = Z;

          ctx.strokeStyle = "#62e6a7";
          ctx.lineWidth = 3;
          ctx.strokeRect(box.x, box.y, box.width, box.height);

          ctx.fillStyle = "#ffff00";
          ctx.beginPath();
          ctx.arc(cx, cy, 6, 0, Math.PI * 2);
          ctx.fill();

          ctx.strokeStyle = "#ffd166";
          ctx.beginPath();
          ctx.moveTo(W / 2, H / 2);
          ctx.lineTo(cx, cy);
          ctx.stroke();

          status.textContent = "얼굴 인식 성공";
        } else {
          document.getElementById("x").textContent = "--";
          document.getElementById("y").textContent = "--";
          document.getElementById("z").textContent = "--";
          status.textContent = "얼굴을 찾는 중...";
        }
      } catch (error) {
        console.error(error);
        status.textContent = "얼굴 인식 오류: 인터넷 연결을 확인하세요.";
      } finally {
        busy = false;
      }

      requestAnimationFrame(detect);
    }
  </script>
</body>
</html>
